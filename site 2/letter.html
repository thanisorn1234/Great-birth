<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>จดหมายลับ 💌</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;0,600;1,600&family=Caveat:wght@500;700&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
<style>
  .paper{
    max-width:620px; margin:20px auto 0;
    background:var(--cream);
    color:#3a2b1f;
    border-radius:6px;
    padding:44px 40px 50px;
    box-shadow:0 24px 60px var(--shadow);
    position:relative;
    background-image:
      linear-gradient(transparent 38px, rgba(0,0,0,.05) 39px);
    background-size:100% 40px;
  }
  .paper .tape{ top:-16px; }
  .paper .tape.left{ left:20px; transform:rotate(-8deg); }
  .paper .tape.right{ left:auto; right:20px; transform:rotate(8deg); }
  .letter-heading{
    font-family:var(--font-hand); font-size:1.4rem; color:var(--berry-deep);
    margin-bottom:2px;
  }
  .letter-body{
    font-family:var(--font-hand);
    font-size:clamp(1.25rem, 2.8vw, 1.55rem);
    line-height:1.85;
    white-space:pre-wrap;
    min-height:280px;
  }
  .caret{ display:inline-block; width:2px; background:var(--berry-deep); animation:blink 1s step-start infinite; margin-left:2px; }
  @keyframes blink{ 50%{ opacity:0; } }
  .sign{ text-align:right; margin-top:14px; font-family:var(--font-hand); font-size:1.6rem; color:var(--berry-deep); }
  .skip-btn{
    display:block; margin:22px auto 0;
    background:none; border:1px solid rgba(255,255,255,.2);
    color:var(--pink-soft); font-family:var(--font-hand); font-size:clamp(1.05rem,2.2vw,1.2rem);
    padding:7px 20px; border-radius:999px; cursor:pointer;
    transition:background .3s cubic-bezier(.22,.68,.35,1), border-color .3s, transform .3s cubic-bezier(.22,.68,.35,1);
  }
  .skip-btn:hover{ background:rgba(255,255,255,.08); border-color:rgba(255,255,255,.35); transform:translateY(-2px); }
</style>
</head>
<body>
<div class="garland" id="garland-top"></div>
<nav class="topnav">
  <a href="index.html">🏠 Home</a>
  <a href="gallery.html">📸 Gallery</a>
  <a href="games.html">🎮 Games</a>
  <a href="letter.html">💌 Letter</a>
  <a href="wish.html">🕯️ Wishes</a>
  <span class="date-pill">🎂 27.07.2569</span>
</nav>
<main>
  <p class="eyebrow reveal">— Letter —</p>
  <h1 class="reveal">กลอนตำนานรักโอ้เดซี่ 💌</h1>

  <article class="paper reveal">
    <div class="tape left"></div>
    <div class="tape right"></div>
    <p class="letter-heading">ถึง คนอ้วนของชั้น</p>
    <div class="letter-body" id="letterBody"></div>
    <p class="sign" id="signLine" style="opacity:0;">รักมักๆนะไอ้อ้วน🩷</p>
  </article>

  <button class="skip-btn" id="skipBtn">ข้ามการพิมพ์ ▶</button>
</main>

<script src="assets/common.js"></script>
<script>
const fullText = `Happy Birthday 🎂

สุขสันต์วันเกิดอีกรอบนะไอ้อึน อายุครบ 20 ปีบริบูรณ์ เลือกใช้ชีวิตให้มีความสุขเข้าไว้ในทุกวัน ใช้ชีวิตไปทีละวัน เรื่องไหนเราสามารถเเก้ปัญหาได้ก็ไม่ต้องเครียด พยายามโตไปทีละนิด ก้าวทีละก้าว ภูมิใจในตัวเองเยอะๆที่ผ่านอะไรมาได้ตลอด เรื่องเรียนก็ไปทีละสเต็ป อย่างน้อยปี 1 ของเเกก็ไม่ได้มีไรผิดพลาดเยอะเมื่อเทียบกับชั้นกับคนอื่นๆ เเกเริ่มต้นมาได้ดีเเล้วเเละชั้นก็ภูมิใจในตัวเเกมากๆ ชั้นมีหน้าที่เเค่สอน เเนะนำ เตือน ซึ่งเเกก็ทำหน้าที่ตัวเองได้ดี เเละชั้นก็จะทำหน้าที่เเบบนี้ต่อไป ขอเเค่เเกเชื่อมั่นในตัวเองชั้นก็จะเชื่อมั่นในตัวเเกด้วย สุดท้าย ชั้นรักเเกมากๆละก็อยากให้ในสิ่งที่ดีที่สุด ขอบคุณที่อยู่ยังด้วยกันมาเเละซัพพอร์ทมาโดยตลอด หวังว่าจะเป็นเเบบนี้ไปเรื่อยๆ นะจะ🩷`;

const bodyEl = document.getElementById('letterBody');
const signEl = document.getElementById('signLine');
let i = 0, typing = null;

function typeStep(){
  if(i <= fullText.length){
    bodyEl.innerHTML = fullText.slice(0,i).replace(/\n/g,'<br>') + '<span class="caret">&nbsp;</span>';
    i += 2;
    typing = setTimeout(typeStep, 28);
  } else {
    bodyEl.innerHTML = fullText.replace(/\n/g,'<br>');
    signEl.style.transition = 'opacity 1s';
    signEl.style.opacity = 1;
  }
}
typing = setTimeout(typeStep, 400);

document.getElementById('skipBtn').addEventListener('click', ()=>{
  clearTimeout(typing);
  i = fullText.length + 1;
  bodyEl.innerHTML = fullText.replace(/\n/g,'<br>');
  signEl.style.transition = 'opacity .4s';
  signEl.style.opacity = 1;
});
</script>
</body>
</html>
